# toolgate policy — https://github.com/RiskAverseTech/toolgate
# Lives at ~/.toolgate/toolgate.yaml (or $TOOLGATE_POLICY). Never read from
# project directories, so a cloned repo can't reconfigure the firewall.

backend:
  provider: auto           # auto | typesafe | gateway | mock
                           # auto = typesafe if TYPESAFE_API_KEY is set, else gateway if AI_GATEWAY_API_KEY is set
  model: auto              # auto = jev-latest (typesafe) / typesafe-ai/jev (gateway)
  timeout_ms: 5000         # observed ~1 s per call via the Gateway; first call can be slower

# When the decision model is unreachable:
#   passthrough = defer to the agent's normal permission flow (default)
#   ask         = force a confirmation prompt
#   deny        = block until the model is back
fail_mode: passthrough

thresholds:
  deny: 0.85               # block at/above this risk probability
  ask: 0.55                # prompt at/above this risk probability
  authorized: 0.8          # if P(task calls for this action) is at/above this, soften one step (deny→ask, ask→allow).
                           # Live data: explicit requests score 0.84–0.89, unrelated ones 0.03–0.18 (docs/live-results-*).

# Tools the model evaluates (whole-name match; exact, a|b list, or regex).
gated_tools: "Bash|Write|Edit|MultiEdit|NotebookEdit|WebFetch|WebSearch|mcp__.*"

# Pull the current task from the transcript so the context questions
# (off_task, authorized, violates_constraint, unresolved_choice) have something to judge against.
include_task_context: true

# Asks and denies always show a "[toolgate] …" line in Claude Code. Allows are quiet
# unless this is on — the hook runs on every gated call.
show_allows: false

# How much the model sees. Input beyond input_chars is cut (head + tail) and the verdict
# can then be no better than ask; the latest prompt beyond task_chars likewise.
# earlier_prompts: user prompts before the latest one, included as context so that a
# "yes" or "continue" is read together with the instruction it continues.
limits:
  input_chars: 20000
  task_chars: 6000
  earlier_prompts: 2

# Claude Code permission modes in which nobody answers a prompt. An `ask` there would be
# auto-resolved, so it becomes a `deny` (the model is told why and stops). Set ask: ask
# to keep asks as asks everywhere. `auto` mode is not listed: a hook's ask still shows
# a permission dialog there (verified on the desktop app).
unattended:
  modes: [bypassPermissions, dontAsk]
  ask: deny

audit:
  enabled: true
  path: ~/.toolgate/audit.jsonl
  log_input: true          # inputs are truncated and secrets redacted

# Static rules run before the model — first match wins, costs nothing.
# Rules you add here run BEFORE the built-ins (rm -rf / or ~ → deny;
# curl | sh → ask; edits to agent safety settings → ask). Patterns match the
# raw tool input values (quotes stripped), case-insensitively.
rules: []
#  - match: { tool: Bash, input_regex: 'terraform\s+destroy' }
#    action: ask
#    reason: Infra teardown needs a human

# Extra questions are merged over the built-ins (destructive, exfiltration, privilege,
# secret_exposure, off_task, violates_constraint, unresolved_choice, plus the `authorized` mitigator).
questions: {}
#  spends_money:
#    type: boolean
#    instructions: This tool call makes a purchase or changes billing.
