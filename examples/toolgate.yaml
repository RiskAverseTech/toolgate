# toolgate policy — https://github.com/RiskAverseTech/toolgate
# Lives at ~/.toolgate/toolgate.yaml (or $TOOLGATE_POLICY). Never read from
# project directories, so a cloned repo can't reconfigure the firewall.

backend:
  provider: auto           # auto | typesafe | openrouter | gateway | opencode-zen | local | mock
                           # auto = typesafe if TYPESAFE_API_KEY is set, else openrouter (OPENROUTER_API_KEY), else gateway (AI_GATEWAY_API_KEY), else opencode-zen (OPENCODE_API_KEY)
  model: auto              # auto = jev-1.13.0 (typesafe, pinned: the version the published numbers were measured on) / typesafe/jev-1.13 (openrouter) / typesafe-ai/jev (gateway) / jev-1.13-free (opencode-zen)
  # endpoint: http://127.0.0.1:8000/v1/systemone
                           # local only (0.18, experimental): a /v1/systemone-compatible server on this machine. Nothing leaves
                           # the machine; nothing is scored yet either. TOOLGATE_LOCAL_API_KEY if the server wants a key.
  timeout_ms: 5000         # observed ~1 s per call via the Gateway; first call can be slower

# When the decision model is unreachable (static rules still run first either way):
#   ask         = force a confirmation prompt (default — fail safe, never a silent allow)
#   deny        = block until the model is back (fail closed)
#   passthrough = defer to the agent's normal permission flow (fail open — not recommended)
fail_mode: ask

thresholds:
  deny: 0.85               # block at/above this risk probability
  ask: 0.55                # prompt at/above this risk probability
  authorized: 0.8          # if P(task calls for this action) is at/above this, soften one step (deny→ask, ask→allow).
                           # Live data: explicit requests score 0.84–0.89, unrelated ones 0.03–0.18 (docs/live-results-*).
  off_task_capability: 0.4 # off_task alone raises an ask only when a capability axis (destructive, exfiltration, privilege,
                           # secret_exposure) is at/above this (0.18). Off-task is a reason for a human when the call could
                           # change something. 0 = always ask on off_task (pre-0.18). Cost: an off-task call that spends
                           # money has no capability axis and passes; docs/usage-2026-10-15.md.

# Tools the model evaluates (whole-name match; exact, a|b list, or regex).
gated_tools: "Bash|Write|Edit|MultiEdit|NotebookEdit|WebFetch|WebSearch|mcp__.*"

# Destinations you declare legitimate (bare hostnames — no scheme, no path). Passed to the
# model as context so sending data to one of these, or a subdomain of it, is not read as
# exfiltration — even a first-ever call to your own API with a credential in it. Only relaxes
# the exfiltration axis, and only for the hosts you name; secrets are still redacted.
trusted_hosts: []
#  - api.acme.com
#  - hooks.internal.acme.com

# Tools you declare your own service — typically MCP servers you run, which carry no hostname
# for trusted_hosts to match. Same whole-name matcher as gated_tools (exact, a|b, regex), or a
# YAML list of names. Tells the model that sending data to this tool is not exfiltration. NOT an
# allow-list: static rules still run first and every other risk axis is judged as usual.
trusted_tools: ""
#  trusted_tools: "mcp__myapi__.*"
#  trusted_tools: [mcp__myapi__upload, mcp__myapi__generate]

# Pull the current task from the transcript so the context questions
# (off_task, authorized, violates_constraint, unresolved_choice) have something to judge against.
include_task_context: true

# Tools that only read (whole-name matcher, same syntax as gated_tools). On these, and on a Bash
# command every part of which is a read (ls, grep, git status, …), off_task alone cannot raise an
# ask: being off-task is a reason for a human when something is about to change. Every other axis
# is judged as usual. The default covers Read/Glob/Grep/WebSearch/WebFetch and MCP tools whose
# name says read/get/list/search/find/navigate.
#  read_only_tools: "Read|Glob|Grep|WebSearch|WebFetch|mcp__.*__(?:get|list|search)_.*"

# An ask you confirmed is not asked again for the identical call (same tool, same input) in the
# same session. Lifts the model's own ask to allow only: never a deny, a static rule, or a floor.
# Not counted in auto mode or the unattended modes, where no person answered.
confirmation_memory: true

# Asks and denies always show a "[toolgate] …" line in Claude Code. Allows are quiet
# unless this is on — the hook runs on every gated call.
show_allows: false

# How much the model sees. Input beyond input_chars is cut (head + tail) and the verdict
# can then be no better than ask. The latest prompt beyond task_chars is cut and flagged but does
# not cap the verdict (0.17): a compaction summary arriving as a user turn is context, not the
# instruction, and the typed prompt before it stays the task.
# earlier_prompts: user prompts before the latest one, included as context so that a
# "yes" or "continue" is read together with the instruction it continues.
# session_goal_chars: the session's first substantive prompt (≥ 40 chars) is included as
# session_goal, cut to this length, so a long session's terse recent prompts are read
# against what the agent was originally asked to do. 0 disables it.
limits:
  input_chars: 40000
  task_chars: 6000
  earlier_prompts: 2
  session_goal_chars: 1200

# Claude Code permission modes in which nobody answers a prompt. An `ask` there would be
# auto-resolved, so it becomes a `deny` (the model is told why and stops). Set ask: ask
# to keep asks as asks everywhere. `auto` mode is not listed: a hook's ask still shows
# a permission dialog there (verified on the desktop app).
unattended:
  modes: [bypassPermissions, dontAsk]
  ask: deny

audit:
  enabled: true
  path: ~/.toolgate/audit.jsonl
  log_input: true          # inputs are truncated and secrets redacted

# The action ledger: per-session record of files this session wrote (proposed at PreToolUse,
# confirmed by PostToolUse) and what each could do if executed, so a later `bash helper.sh`
# is judged as what helper.sh does. Stores paths and booleans only, never content.
# Needs the PostToolUse hooks that `toolgate install` adds.
ledger:
  enabled: true
  dir: ~/.toolgate/ledger
  max_events: 1000

# Static rules run before the model — first match wins, costs nothing. Order:
# built-in DENIES first (rm -rf / or ~ — a rule here can never override those),
# then your rules, then the remaining built-in asks (curl | sh; edits to agent
# safety settings), which a rule here may deliberately override. Patterns match
# the raw tool input values (quotes stripped), case-insensitively.
rules: []
#  - match: { tool: Bash, input_regex: 'terraform\s+destroy' }
#    action: ask
#    reason: Infra teardown needs a human

# Extra questions are merged over the built-ins (destructive, exfiltration, privilege,
# secret_exposure, off_task, violates_constraint, unresolved_choice, plus the `authorized` mitigator).
questions: {}
#  spends_money:
#    type: boolean
#    instructions: This tool call makes a purchase or changes billing.
